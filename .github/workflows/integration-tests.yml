name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Run integration tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    tags: [ 'v*' ]

env:
  GO_VERSION: '1.23'

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_DB: parsedmarc_test
          CLICKHOUSE_USER: parsedmarc
          CLICKHOUSE_PASSWORD: test123
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      kafka:
        image: apache/kafka:latest
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_NETWORK_THREADS: 3
          KAFKA_NUM_IO_THREADS: 8
          KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
          KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
          KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
          
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Wait for services to be ready
        run: |
          # Wait for ClickHouse
          echo "Waiting for ClickHouse..."
          for i in {1..30}; do
            if wget --no-verbose --tries=1 --spider http://localhost:8123/ping; then
              echo "ClickHouse is ready!"
              break
            fi
            echo "Waiting for ClickHouse... ($i/30)"
            sleep 2
          done

          # Wait for Kafka (needs more time to initialize KRaft metadata)
          echo "Waiting for Kafka..."
          sleep 10  # Give Kafka time to initialize

          for i in {1..60}; do
            if nc -z localhost 9092 2>/dev/null; then
              echo "Kafka port is open!"
              # Additional wait for Kafka to be fully ready and accept connections
              sleep 10
              echo "Kafka is ready!"
              break
            fi
            echo "Waiting for Kafka... ($i/60)"
            sleep 3
          done

          # Wait for MailHog
          echo "Waiting for MailHog..."
          for i in {1..30}; do
            if nc -z localhost 1025 2>/dev/null; then
              echo "MailHog is ready!"
              break
            fi
            echo "Waiting for MailHog... ($i/30)"
            sleep 2
          done

      - name: Initialize test environment
        run: |
          # Make scripts executable
          chmod +x scripts/init-clickhouse.sh
          
          # Initialize ClickHouse
          ./scripts/init-clickhouse.sh

      - name: Run integration tests
        run: make test-integration-ci
        env:
          PARSEDMARC_TEST_MODE: true
          CLICKHOUSE_URL: tcp://localhost:9000
          CLICKHOUSE_USERNAME: parsedmarc
          CLICKHOUSE_PASSWORD: test123
          CLICKHOUSE_DATABASE: parsedmarc_test
          KAFKA_BROKERS: localhost:9092

      - name: Service diagnostics on failure
        if: failure()
        run: |
          echo "=== Service Diagnostics ==="
          echo "ClickHouse status:"
          curl -s http://localhost:8123/ping || echo "ClickHouse not responding"
          echo ""
          echo "Kafka port status:"
          nc -zv localhost 9092 || echo "Kafka port not open"
          echo ""
          echo "MailHog port status:"
          nc -zv localhost 1025 || echo "MailHog port not open"
          echo ""
          echo "Running containers:"
          docker ps || echo "Cannot list containers"

      - name: Generate integration test report
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ClickHouse integration tested" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Kafka integration tested" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Email output integration tested" >> $GITHUB_STEP_SUMMARY